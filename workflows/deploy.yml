name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v3
        with:
          repository: vercel/vercel-deploy
      # Vercel auto-deploys on push to main if Vercel project is connected
      # This job is informational. Customize via Vercel UI / CLI.
      - name: Vercel deploy
        run: echo "Deploy handled by Vercel GitHub integration"

  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Railway auto-deploys on push if Railway project is connected via GitHub App
      # This job is informational. Configure via Railway UI.
      - name: Railway deploy
        run: echo "Deploy handled by Railway GitHub App"
